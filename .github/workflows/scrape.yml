name: Mudah Property Scraper

on:
  # Manual only: press "Run workflow" in the Actions tab.
  # To auto-run daily at 10am MYT, add:
  # schedule:
  #   - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      listing_type:
        description: "What to scrape"
        type: choice
        options:
          - both
          - sale
          - rent
        default: both

jobs:
  scrape:
    name: Scrape & Save CSV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests==2.32.3

      - name: Run scraper
        env:
          LISTING_TYPE: ${{ github.event.inputs.listing_type || 'both' }}
        run: python scraper.py

      - name: Commit CSV results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "📦 Scrape (${{ github.event.inputs.listing_type || 'both' }}): $(date +'%Y-%m-%d %H:%M')"
          git push
