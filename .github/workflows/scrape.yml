name: Mudah Property Scraper

on:
  schedule:
    # 10:00 AM Malaysia Time (MYT = UTC+8) → 02:00 UTC
    - cron: "0 2 * * *"

  # Run manually anytime from the Actions tab
  workflow_dispatch:

jobs:
  scrape:
    name: Scrape & Save CSV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      # Commit the updated CSV files back into the repo
      - name: Commit CSV results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "📦 Daily scrape: $(date +'%Y-%m-%d')"
          git push
