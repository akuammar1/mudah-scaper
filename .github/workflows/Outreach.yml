name: WhatsApp outreach

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  outreach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare today's leads
        run: python whatsapp_outreach.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Keep the HTML page as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: outreach
          path: outreach/

      - name: Save contacted log
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add contacted.csv
          git diff --cached --quiet || (git commit -m "Update contacted log" && git push)
